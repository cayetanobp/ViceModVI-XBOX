[package]
name = "vicemodvi-cli"
description = "ViceModVI command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vicemodvi"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vicemodvi-core = { path = "../vicemodvi-core" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
