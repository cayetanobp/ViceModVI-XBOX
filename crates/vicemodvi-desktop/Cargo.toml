[package]
name = "vicemodvi-desktop"
description = "ViceModVI desktop viewer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vicemodvi-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vicemodvi-core = { path = "../vicemodvi-core" }
eframe = "0.37"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.18"
