[workspace]
resolver = "2"
members = [
    "crates/vicemodvi-core",
    "crates/vicemodvi-cli",
    "crates/vicemodvi-desktop",
]
# Vendored third-party crates are built as dependencies, not as members.
exclude = ["tools/model-reader/vendor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
type_complexity = "allow"
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding lets the reader turn an unexpected parser panic into an error
# instead of terminating the process.
panic = "unwind"

# Optimize dependencies in debug builds so that previews stay responsive.
[profile.dev.package."*"]
opt-level = 2
