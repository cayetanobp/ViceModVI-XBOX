name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --check HEAD^1 HEAD
          if git diff --quiet --no-renames HEAD^1 HEAD -- . \
            ':(exclude,top)README.md' ':(exclude,top)CONTRIBUTING.md' \
            ':(exclude,top)PENDING.md' ':(exclude,top,glob)docs/**/*.md'; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.changes.outputs.docs_only != 'true'
        run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal

      - name: Build workspace
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo +1.100.0-x86_64-pc-windows-msvc build --locked --workspace

      - name: Run workspace tests
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo +1.100.0-x86_64-pc-windows-msvc test --locked --workspace
