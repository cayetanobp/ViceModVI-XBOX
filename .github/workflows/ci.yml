name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --check HEAD^1 HEAD
          if git diff --quiet --no-renames HEAD^1 HEAD -- . \
            ':(exclude,top)README.md' ':(exclude,top)CONTRIBUTING.md' \
            ':(exclude,top)PENDING.md' ':(exclude,top,glob)docs/**/*.md'; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.changes.outputs.docs_only != 'true'
        run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal --component clippy

      - name: Build workspace
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo +1.100.0-x86_64-pc-windows-msvc build --locked --workspace

      - name: Run workspace tests
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo +1.100.0-x86_64-pc-windows-msvc test --locked --workspace

      - name: Run Clippy and enforce warnings on changed lines
        if: steps.changes.outputs.docs_only != 'true'
        run: python .github/scripts/clippy_diff.py

  security:
    name: Scan secrets and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for secrets
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          archive=gitleaks_8.30.0_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/$archive" -o "$dir/$archive"
          (cd "$dir" && echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check)
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -n "$base" && "$base" != 0000000000000000000000000000000000000000 ]]; then
            "$dir/gitleaks" git --redact=100 --log-opts="$base..HEAD" .
          else
            "$dir/gitleaks" git --redact=100 .
          fi

      - name: Audit locked Rust dependencies
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          archive=cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/$archive" -o "$dir/$archive"
          (cd "$dir" && echo "b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59  $archive" | sha256sum --check)
          tar -xzf "$dir/$archive" -C "$dir"
          audit="$(find "$dir" -type f -name cargo-audit -print -quit)"
          "$audit" audit --file "$GITHUB_WORKSPACE/Cargo.lock"

  required:
    # Preserve the existing branch ruleset check name.
    name: Verify Windows x64
    if: ${{ always() }}
    needs: [verify, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both job results
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "Windows verification: $VERIFY_RESULT"
          echo "Security checks: $SECURITY_RESULT"
          test "$VERIFY_RESULT" = success && test "$SECURITY_RESULT" = success
